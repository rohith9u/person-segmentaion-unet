# Configuration for Experiment B: Augmented U-Net (Controlled Augmentations)

experiment:
  name: "augmented"
  description: "U-Net trained with controlled horizontal flips and random zooms"
  seed: 42

model:
  name: "UNet"
  in_channels: 3
  out_channels: 1
  encoder_channels: [32, 64, 128, 256]
  bottleneck_channels: 512
  decoder_channels: [256, 128, 64, 32]

training:
  loss: "BCEWithLogitsLoss"
  optimizer: "Adam"
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 8
  max_epochs: 35
  num_workers: 0
  early_stopping:
    enabled: true
    patience: 8
    metric: "val_iou"
    mode: "max"

augmentation:
  enabled: true
  hflip_prob: 0.5
  zoom_min: 0.9
  zoom_max: 1.1

paths:
  processed_images_dir: "data/processed/images"
  processed_masks_dir: "data/processed/masks"
  splits_dir: "splits"
  checkpoint_file: "models/augmented_unet.pth"
  curves_file: "results/training_curves/augmented_curves.png"
  log_file: "results/experiment_logs/augmented_log.json"
