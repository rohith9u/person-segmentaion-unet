# Configuration for U-Net Controlled Training Experiments

experiment:
  seed: 42

model:
  name: "UNet"
  in_channels: 3
  out_channels: 1
  features: [32, 64, 128, 256]
  bottleneck: 512

training:
  loss: "BCEWithLogitsLoss"
  optimizer: "Adam"
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 8
  max_epochs: 50
  num_workers: 0 # Safe for Windows multiprocessing
  early_stopping:
    enabled: true
    patience: 10
    metric: "val_iou"
    mode: "max"

augmentation:
  hflip_prob: 0.5
  zoom_min: 0.9
  zoom_max: 1.1

paths:
  processed_images_dir: "data/processed/images"
  processed_masks_dir: "data/processed/masks"
  splits_dir: "splits"
  models_dir: "models"
  curves_dir: "results/training_curves"
  logs_dir: "results/experiment_logs"
